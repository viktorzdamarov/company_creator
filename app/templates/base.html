<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Adrobot{% endblock %} · Adrobot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%235cb85c'/></svg>">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {% if demo_mode() %}<div class="demo-banner">DEMO: данные вымышленные, настоящий Keitaro не используется</div>{% endif %}
  <header class="topbar">
    <a class="brand" href="/">Adrobot</a>
    <nav>
      <a href="/create" class="{{ 'active' if active == 'create' }}">New campaign</a>
      <a href="/edit" class="{{ 'active' if active == 'edit' }}">Editor</a>
      <a href="/docs" target="_blank">API</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
